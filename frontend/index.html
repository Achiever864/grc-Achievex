<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Graduate Research Clinic - Empowering African Scholars</title>
    <meta
      name="title"
      content="Graduate Research Clinic - Empowering African Scholars"
    />
    <meta
      name="description"
      content="The Graduate Research Clinic connects African scholars, researchers, and mentors. Access funding opportunities, research resources, mentorship programs, and capacity building workshops."
    />
    <meta
      name="keywords"
      content="African scholars, graduate research, research funding, research, academic mentorship, PhD opportunities, postdoctoral research, African research network, research grants, scholarship opportunities, academic development Africa"
    />
    <meta name="author" content="Graduate Research Clinic" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://graduateresearchclinic.org" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://graduateresearchclinic.org/" />
    <meta
      property="og:title"
      content="Graduate Research Clinic - Empowering African Scholars"
    />
    <meta
      property="og:description"
      content="Connect with researchers, access funding, and advance African scholarship"
    />
    <meta
      property="og:image"
      content="https://graduateresearchclinic.org/og-image.jpg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://graduateresearchclinic.org/"
    />
    <meta
      property="twitter:title"
      content="Graduate Research Clinic - Empowering African Scholars"
    />
    <meta
      property="twitter:description"
      content="Connect with researchers, access funding, and advance African scholarship"
    />
    <meta
      property="twitter:image"
      content="https://graduateresearchclinic.org/og-image.jpg"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Graduate Research Clinic",
        "alternateName": "GRC",
        "url": "https://graduateresearchclinic.org",
        "logo": "https://graduateresearchclinic.org/logo.png",
        "description": "Empowering African scholars through research collaboration, mentorship, and funding opportunities",
        "foundingDate": "2020",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "NG"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "info@graduateresearchclinic.org",
          "contactType": "Customer Service",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://twitter.com/graduateresearchclinic",
          "https://linkedin.com/company/graduateresearchclinic",
          "https://facebook.com/graduateresearchclinic"
        ]
      }
    </script>

    <link rel="stylesheet" href="/src/App.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Graduate Research Clinic</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
